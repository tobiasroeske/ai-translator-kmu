# =============================================================================
# KI Translator KMU — Docker Compose
# =============================================================================
# Two usage modes:
#
#   1. Default (Mistral provider — no Ollama):
#        docker compose up
#
#   2. Local AI with Ollama:
#        docker compose --profile ollama up
#
# Prerequisites: copy .env.local.example → .env.local and fill in values.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass public env vars so Next.js can bake them in at build time.
      # Secret keys (SERVICE_ROLE, API keys) are injected at runtime below.
      # Defaulted to empty so the file also parses when only the ollama service is
      # being started and no .env.local exists yet — the demo path does exactly that.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    image: ki-translator-kmu:latest
    container_name: ki-translator-kmu-app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    # Load all runtime secrets from .env.local — never commit this file.
    # required: false so the ollama service can be started on its own (the local
    # demo path) before any .env.local exists — compose validates every service's
    # env_file at parse time, even for services it is not about to start.
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      # The pnpm docker:* scripts pin this, so the command that starts the Ollama
      # container is also the one that uses it. Without the pin, .env.local decided
      # the provider and `docker:up` could run the model container unused.
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      # Inside the container, "localhost" is the container itself — NOT the host.
      # The app reaches the Ollama *container* over the compose network via its
      # service name. This is only consumed when AI_PROVIDER=ollama (the
      # `--profile ollama` demo path). Set here (not in .env.local) so it always
      # wins over env_file and never bleeds into the host `pnpm dev` loop, where
      # the app should talk to the *native* Ollama on localhost:11434 instead.
      OLLAMA_BASE_URL: http://ollama:11434
    healthcheck:
      # Verify the app is actually serving requests, not just "running".
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Ollama — Local AI inference (optional profile)
  # Activate with: docker compose --profile ollama up
  #
  # The image runs unmodified: models are pulled over Ollama's HTTP API by
  # scripts/ollama.mjs, which the pnpm demo and docker:up scripts both call. An
  # in-container pull script would duplicate that, and shell probes inside this
  # image are a trap — it ships neither curl nor wget.
  #
  # Models live in a named volume, so they are downloaded once and survive
  # `docker compose down`.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ki-translator-kmu-ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      # Expose on localhost only — Ollama should not be publicly reachable.
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # `ollama list` rather than an HTTP probe — no HTTP client in the image.
      test: ['CMD-SHELL', 'ollama list || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      # Serving starts in seconds now that nothing downloads during startup.
      start_period: 20s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Ollama model storage — persists across `docker compose down` without -v.
  ollama_models:
    driver: local
